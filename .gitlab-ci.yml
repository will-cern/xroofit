stages:
  - build
  - deploy


build:
  stage: build
  image: gitlab-registry.cern.ch/atlas/statanalysis:0-6-1
  script:
    - source /release_setup.sh
    - mkdir -p build
    - cd build
    - cmake ../xRooFit
    - make -j4
  artifacts:
    paths: 
      - build
      #- NPCheck
      #- pyfittools



image: python:3.6

send-snapshot:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+/
  script:
    - pip install gitlab2zenodo
    - git archive --format zip --output ${CI_COMMIT_TAG#v}.zip ${CI_COMMIT_TAG}
    - g2z-send -t $zenodo_token -m .zenodo.json ${CI_COMMIT_TAG#v}.zip
