stages:
  - build
  - test
  - deploy


build:
  stage: build
  image: gitlab-registry.cern.ch/atlas/statanalysis:0.7
  script:
    - echo $PATH
    - source /release_setup.sh
    - mkdir -p build
    - cd build
    - echo $PATH
    - which cmake
    - cmake ../
    - make -j4
  artifacts:
    paths: 
      - build
      #- NPCheck
      #- pyfittools


test:
  stage: test
  image: gitlab-registry.cern.ch/atlas/statanalysis:0.7
  dependencies:
    - build
  script:
    - source /release_setup.sh
    - source build/setup.sh
    - python3 test/test_single_bin_cls.py


send-snapshot:
  stage: deploy
  image: python:3.6
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+/
  script:
    - pip install gitlab2zenodo
    - git archive --format zip --output ${CI_COMMIT_TAG#v}.zip ${CI_COMMIT_TAG}
    - g2z-send -t $zenodo_token -m .zenodo.json ${CI_COMMIT_TAG#v}.zip

